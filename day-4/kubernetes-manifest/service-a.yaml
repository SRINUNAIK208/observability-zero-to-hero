apiVersion: apps/v1 
kind: Deployment
metadata:
  name: service-a
  namespace: dev 
spec:
 replicas: 1 
 selector:
   matchLabels:
      project: prometheus
      tier: Monitoring
 template:
   metadata:
     labels:
        project: prometheus
        tier: Monitoring
   spec:
    containers: 
    - name: app-service-1
      image: srinunaik208/service-a:v1 
      imagePullPolicy: Always
      ports:
      - containerPort: 3001
      env:
      - name: OTEL_EXPORTER_JAEGER_ENDPOINT
        value: "http://jaeger-collector.tracing:14268/api/traces"
      - name: SERVICE_B_URI
        value: "http://b-service.dev"

       
---
apiVersion: v1 
kind: Service
metadata:
  name: service-a
  namespace: dev 
  labels:
   project: prometheus
   tier: Monitoring
    
spec:
 type: LoadBalancer
 selector:
   project: prometheus
   tier: Monitoring
 ports:
 - name: a-service-port
   protocol: TCP 
   port: 80
   targetPort: 3001