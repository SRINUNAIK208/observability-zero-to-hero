apiVersion: apps/v1 
kind: Deployment
metadata:
  name: service-B
  namespace: dev 
spec:
 replicas: 1 
 selector:
   matchLabel:
      project: prometheus
      tier: Monitoring
 template:
   metadata:
     label:
        project: prometheus
        tier: Monitoring
   spec:
    container: 
    - name: app-service-B
      image: srinunaik208/service-b:v1 
      imagePullPolicy: Always
      ports:
      - containerPort: 3001
      env:
      - name: OTEL_EXPORTER_JAEGER_ENDPOINT
        value: "http://jaeger-collector.tracing:14268/api/traces"
      - name: SERVICE_B_URI
        value: "http://b-service.dev"

---
apiVersion: v1 
kind: service
metadata:
  name: service-B
  namespace: dev 
spec:
 selector:
   project: prometheus
   component: Monitoring
 ports:
 - protocol: TCP 
   port: 80
   targetPort: 3002
       
